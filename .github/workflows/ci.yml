name: PS-V Experiment-03 CI

on:
  push:
    paths:
      - 'PS-V/Experiment-03/**'
    branches:
      - main

  pull_request:
    paths:
      - 'PS-V/Experiment-03/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: python -m pip install --upgrade pip

      - name: Run Experiment-03 Script
        run: |
          echo "Running Experiment-03"
          python PS-V/Experiment-03/code.py
